name: co_golden
description: >-
  Golden matrix testing for Flutter: capture one scenario across devices,
  themes, locales, and text scales with strict layout diagnostics and a JSON
  run manifest. Theme-agnostic axes fit design systems such as CoUI, and a
  built-in binding switches Slang locales per variant.
version: 0.2.0
repository: https://github.com/coco-de/co-package/tree/main/packages/co_golden
resolution: workspace

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  clock: ^1.1.1
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  meta: ^1.16.0
  path: ^1.9.0
  slang: ^4.19.0

dev_dependencies:
  lints: ^6.0.0
