name: open_epub_engine
description: >-
  Pure-Dart EPUB 2/3 parser, object model, and CFI locator engine for open_epub.
  open_epub 1.0 코어의 커스텀 파서를 추출·확장하고, epub_pro(BSD-3/MIT)의 CFI
  서브시스템을 채택했다. epubx/epub_view를 대체한다.
version: 0.0.1
publish_to: "none" # 모노레포 내부 패키지 (발행은 GA/E6까지 유예)

environment:
  sdk: ">=3.6.0 <4.0.0" # pub workspace 최소 요건

# 모노레포 pub workspace 멤버 (S10.1, ADR-008)
resolution: workspace

dependencies:
  # EPUB 컨테이너(ZIP) 해제
  archive: ^3.6.1
  # OPF/NCX/nav/SMIL XML 파싱
  xml: ^6.6.1
  # 경로 정규화 (spine href 상대경로 해석 등)
  path: ^1.9.0

dev_dependencies:
  lints: ^6.0.0 # 워크스페이스 flutter_lints 6과 정합
  test: ^1.25.0
