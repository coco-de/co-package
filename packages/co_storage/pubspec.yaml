name: co_storage
description: >-
  File storage for Dart servers: one API over AWS S3 and S3-compatible
  services (R2, MinIO, Spaces), local disk and memory, plus signed direct
  uploads so an app's secret keys stay on its server. Forked from dox_storage.
version: 0.1.0
repository: https://github.com/coco-de/co-package/tree/main/packages/co_storage
# pub.dev 에 내지 않는다 — 소비자는 git 의존(path: packages/co_storage, ref: 릴리스 태그)으로 받는다.
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  crypto: ^3.0.7
  http: ^1.6.0
  mime: ^2.1.0
  path: ^1.9.1

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0

# SigV4 테스트 벡터는 AWS 문서의 공개 예제 키를 담는다 — 비밀이 아니다.
false_secrets:
  - /test/fixtures/sigv4_vectors.json
