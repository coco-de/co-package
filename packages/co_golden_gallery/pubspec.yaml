name: co_golden_gallery
description: >-
  Builds a searchable HTML gallery from co_golden capture output
  and plain golden PNG trees: a device × theme × locale grid per scenario,
  failure highlighting, and images served locally or from a CDN or bucket.
version: 0.2.1
repository: https://github.com/coco-de/co-package/tree/main/packages/co_golden_gallery
resolution: workspace

environment:
  sdk: ">=3.11.0 <4.0.0"

executables:
  co_golden_gallery:

dependencies:
  args: ^2.7.0
  coui_web: any
  jaspr: ^0.23.5
  meta: ^1.16.0
  path: ^1.9.0

dev_dependencies:
  crypto: ^3.0.0
  lints: ^6.0.0
  test: ^1.26.0

# Used by this workspace. Git consumers must repeat both overrides at their root.
dependency_overrides:
  coui_web:
    git:
      url: https://github.com/coco-de/coui.git
      path: packages/coui_web
      ref: 86930350cacd5511d6994c289cd4c436d4bb56a9
  coui_core:
    git:
      url: https://github.com/coco-de/coui.git
      path: packages/coui_core
      ref: 86930350cacd5511d6994c289cd4c436d4bb56a9
