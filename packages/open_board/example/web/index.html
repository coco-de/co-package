<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Open Board - Flutter Drawing Package Demo">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="open_board_example">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Open Board Demo</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // Pre-boot background (co_demo_prefs protocol v1): paint the page in the
    // visitor's theme before Flutter boots, so a dark pick on demo.cocode.im
    // does not flash white while main.dart.js loads. LIGHT / DARK = this app's
    // light / dark scaffold background (exampleTheme in lib/demo_settings.dart).
    (function () {
      var LIGHT = '#FBF8FF', DARK = '#121318';
      try {
        var t = new URLSearchParams(location.search).get('theme');
        if (t === null) {
          var h = location.hash, i = h.indexOf('?');
          if (i >= 0) t = new URLSearchParams(h.slice(i + 1)).get('theme');
        }
        t = (t || '').trim().toLowerCase();
        if (t !== 'light' && t !== 'dark') {
          // The app follows the system theme when nothing is passed.
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        var root = document.documentElement.style;
        root.colorScheme = t;
        root.backgroundColor = t === 'dark' ? DARK : LIGHT;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
