name: open_board_example
description: "Open Board 패키지 데모 앱"
publish_to: 'none'
version: 1.0.0+1

# 모노레포 pub workspace 멤버 — open_board · open_epub(→ open_epub_engine)을 로컬
# 해석한다. 비공개 git 의존성이 없어 토큰 없이 `flutter pub get` 이 된다 (#42).
resolution: workspace

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  open_board:
    path: ../
  open_epub:
    path: ../../open_epub
  marionette_flutter: ^0.6.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/books/
