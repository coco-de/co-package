name: CI - Test & Analyze

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.41.6"

jobs:
  test-and-analyze:
    name: Test & Analyze
    runs-on: self-hosted
    # ⚠️ 15분이었으나 GH Actions 캐시 서비스에 flutter 캐시 엔트리가 없으면
    # (Cache not found for input keys: flutter-macos-stable-...) Setup Flutter
    # 가 SDK 전체를 다운로드하며 5~15분을 소모해, 부하 시 잡이 예산을 넘겨
    # **timeout 이 '취소'로 기록**된다 — PR #267 attempt 1~3 연속 실측.
    # 취소되면 Post 단계의 캐시 저장도 스킵돼 다음 run 도 미스인 악순환이
    # 된다. 30분은 cold 다운로드를 흡수해 첫 완주(=캐시 생성)를 보장하기
    # 위한 값이고, 캐시 히트 시 평시 소요는 종전과 같다 (unibook 이 같은
    # 이유로 SDK 셋업 타임아웃을 40분으로 두는 것과 동일 근거).
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # `example/` 이 private git 의존성(open-epub, ref 고정 커밋)을 갖고 있어
      # `flutter pub get` 이 example 을 함께 resolve 하며 pub 캐시 리포를
      # fetch 한다. 이 fetch 는 별개 git 프로세스라 checkout 의 로컬 자격증명을
      # 보지 못하고, self-hosted 러너(launchd 데몬 세션)는 gh 의 Keychain
      # 토큰에도 접근하지 못해 "could not read Username for
      # 'https://github.com': Device not configured" 로 죽는다 — 러너의
      # pub-cache 에 해당 커밋이 이미 있느냐에 따라 복불복으로 통과해 왔다
      # (kobic#8433 실측과 동일 실패, unibook `git-auth-pub-deps` composite 와
      # 같은 처방). 러너 fleet 은 한 호스트에 여러 인스턴스가 공유
      # `$HOME/.gitconfig` 를 가지므로, lock 경합을 피해 인스턴스별
      # GIT_CONFIG_GLOBAL 에 토큰 insteadOf 를 주입한다.
      - name: 🔐 Private git 의존성 pub get 인증 주입
        run: |
          GIT_CONFIG_PATH="$HOME/.gitconfig-${RUNNER_NAME:-default}"
          echo "GIT_CONFIG_GLOBAL=$GIT_CONFIG_PATH" >> "$GITHUB_ENV"
          export GIT_CONFIG_GLOBAL="$GIT_CONFIG_PATH"

          # stale lock 파일 정리 (이전 빌드 비정상 종료 시 잔여)
          rm -f "${GIT_CONFIG_PATH}.lock" 2>/dev/null || true

          git config --global \
            url."https://x-access-token:${{ secrets.SUBMODULE_TOKEN }}@github.com/".insteadOf \
            "https://github.com/"

      - name: Install dependencies
        run: |
          # workspace resolution 임시 제거 (standalone 빌드용)
          # ⚠️ `sed -i` 를 쓰지 말 것 — self-hosted 풀에 macOS(BSD)·Linux 머신이
          # 섞여 있어 어느 러너가 잡히느냐에 따라 복불복으로 깨진다. BSD sed 는
          # `-i` 뒤에 백업 확장자를 요구하므로 GNU 문법이면 스크립트를 확장자로
          # 먹고 `sed: 1: "pubspec.yaml": extra characters at the end of p
          # command` 로 죽는다. 이 스텝이 죽으면 pub get 이 안 돼 테스트·DCM 이
          # 전부 연쇄 실패한다. `perl -pi` 는 양쪽에서 동일하게 동작한다.
          # (같은 함정 선례: release.yml 헤더 주석, coui version.yaml 40회 중 39회 실패)
          perl -pi -e 's/^resolution: workspace/# resolution: workspace/' pubspec.yaml
          flutter pub get

      - name: Run tests
        run: flutter test

      - name: Restore pubspec
        if: always()
        run: |
          perl -pi -e 's/^# resolution: workspace/resolution: workspace/' pubspec.yaml

      - name: Setup DCM
        if: always()
        uses: CQLabs/setup-dcm@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ⚠️ dcm 은 CI 에서 라이선스 키를 요구한다 — env 가 없으면 검사를 수행하지
      # 않고 usage 를 찍으며 exit 64 로 죽는다("Both CI key and purchase email
      # should be provided to run on CI."). 아래 Dashboard Upload 스텝만 secrets
      # 를 넘기고 있어 포맷 게이트가 상시 red 였다 (kobic #9838).
      # ⚠️ `--fatal-found` 는 기존 포맷 부채 35개 파일이 정리된 뒤에 복원한다
      # (#257). 키를 넣자마자 fatal 로 켜면 이 부채 때문에 무관한 PR 이 전부
      # 차단된다 — 이 게이트는 그동안 exit 64 로 죽어 한 번도 실제 검사를 한
      # 적이 없어서, 부채가 그대로 쌓여 있다. 우선 결과가 보이게만 만든다.
      - name: DCM Format Check
        if: always()
        env:
          DCM_CI_KEY: ${{ secrets.DCM_CI_KEY }}
          DCM_EMAIL: ${{ secrets.DCM_EMAIL }}
        # `--no-fatal-found` 는 dry-run 에 적용되지 않아 변경이 있으면 그대로
        # exit 1 이다. 아래 DCM Analyze 스텝과 동일하게 `|| true` 로 받는다.
        run: dcm format lib --dry-run --no-fatal-found || true

      - name: DCM Analyze
        if: always()
        env:
          DCM_CI_KEY: ${{ secrets.DCM_CI_KEY }}
          DCM_EMAIL: ${{ secrets.DCM_EMAIL }}
        run: |
          dcm run lib --all --no-fatal-found || true

      - name: DCM Dashboard Upload
        if: github.event_name == 'push' && (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/main')
        run: |
          dcm run lib \
            --analyze \
            --metrics \
            --unused-code \
            --unused-files \
            --dependencies \
            --code-duplication \
            --upload \
            --project "${{ secrets.DCM_PROJECT_KEY }}" \
            --ci-key "${{ secrets.DCM_CI_KEY }}" \
            --email "${{ secrets.DCM_EMAIL }}"
