name: Deploy to GitHub Pages

on:
  push:
    branches: [development, main]
  workflow_dispatch:

# Pages 소스 = gh-pages 브랜치(legacy). 빌드 산출물을 gh-pages 로 직접 푸시한다.
# actions/deploy-pages(Actions 아티팩트 방식)는 Pages 소스가 "GitHub Actions"여야 동작하므로
# 현재 설정(브랜치 배포)과 맞지 않아 사용하지 않는다.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Remove workspace resolution and clean dev_dependencies
        run: |
          sed -i '/^resolution:/d' pubspec.yaml
          sed -i '/^  fake_async:/d' pubspec.yaml
          sed -i '/^  mocktail:/d' pubspec.yaml
          sed -i '/^  shared_preferences:/d' pubspec.yaml
          sed -i '/^  path_provider_platform_interface:/d' pubspec.yaml
          sed -i '/^  plugin_platform_interface:/d' pubspec.yaml

      # example 이 비공개 저장소 coco-de/open-epub 을 git 의존성으로 사용한다.
      # PRIVATE_REPO_PAT: fine-grained PAT (coco-de/open-epub, Contents: Read-only)
      - name: Verify PRIVATE_REPO_PAT is configured
        env:
          PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          if [ -z "$PRIVATE_REPO_PAT" ]; then
            echo "::error::PRIVATE_REPO_PAT 시크릿이 비어 있습니다. coco-de/open-epub(Contents: Read) 권한의 fine-grained PAT 를 등록하세요: gh secret set PRIVATE_REPO_PAT --repo coco-de/open-board"
            exit 1
          fi

      - name: Configure git auth for private dependencies
        run: |
          git config --global url."https://x-access-token:${{ secrets.PRIVATE_REPO_PAT }}@github.com/coco-de/".insteadOf "https://github.com/coco-de/"

      - name: Install dependencies
        working-directory: example
        run: flutter pub get

      - name: Build web (WebAssembly, fallback to JS)
        working-directory: example
        run: |
          flutter build web --wasm --release --base-href /open-board/ || \
          flutter build web --release --base-href /open-board/

      # gh-pages 를 단일 커밋으로 강제 갱신 → 배포 산출물이 히스토리에 누적되지 않는다.
      - name: Deploy to gh-pages branch
        working-directory: example/build/web
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch .nojekyll
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "deploy: ${GITHUB_SHA::7} 최신 빌드 (${GITHUB_REF_NAME})"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
