name: Deploy to GitHub Pages

on:
  push:
    branches: [development, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Remove workspace resolution and clean dev_dependencies
        run: |
          sed -i '/^resolution:/d' pubspec.yaml
          sed -i '/^  fake_async:/d' pubspec.yaml
          sed -i '/^  mocktail:/d' pubspec.yaml
          sed -i '/^  shared_preferences:/d' pubspec.yaml
          sed -i '/^  path_provider_platform_interface:/d' pubspec.yaml
          sed -i '/^  plugin_platform_interface:/d' pubspec.yaml

      - name: Install dependencies
        working-directory: example
        run: flutter pub get

      - name: Build web (WebAssembly)
        working-directory: example
        run: flutter build web --wasm --release --base-href /open-board/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: example/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
