name: Deploy to GitHub Pages

on:
  push:
    branches: [development, main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "빌드까지만 수행하고 gh-pages 푸시는 건너뛴다 (PAT·빌드 진단용)"
        type: boolean
        default: false

# Pages 소스 = gh-pages 브랜치(legacy). 빌드 산출물을 gh-pages 로 직접 푸시한다.
# actions/deploy-pages(Actions 아티팩트 방식)는 Pages 소스가 "GitHub Actions"여야 동작하므로
# 현재 설정(브랜치 배포)과 맞지 않아 사용하지 않는다.
permissions:
  contents: write

# dry-run 은 실제 배포와 다른 그룹 — 진단 실행이 진행 중인 배포를 취소하지 않는다.
concurrency:
  group: ${{ inputs.dry_run && 'pages-dry-run' || 'pages' }}
  cancel-in-progress: true

env:
  # example 이 git 의존성으로 쓰는 비공개 저장소. 아래 PAT 검증 단계가 이 저장소 읽기를 확인한다.
  PRIVATE_DEP_REPO: coco-de/open-epub
  # 자격증명이 없으면 프롬프트로 무한 대기하지 않고 즉시 실패한다.
  GIT_TERMINAL_PROMPT: "0"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # 이 잡은 checkout 자격증명을 쓰지 않는다 — 배포 푸시는 GITHUB_TOKEN 을 URL 에 직접 넣는다.
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Remove workspace resolution and clean dev_dependencies
        run: |
          sed -i '/^resolution:/d' pubspec.yaml
          sed -i '/^  fake_async:/d' pubspec.yaml
          sed -i '/^  mocktail:/d' pubspec.yaml
          sed -i '/^  shared_preferences:/d' pubspec.yaml
          sed -i '/^  path_provider_platform_interface:/d' pubspec.yaml
          sed -i '/^  plugin_platform_interface:/d' pubspec.yaml

      # PRIVATE_REPO_PAT: fine-grained PAT.
      #   - Resource owner: coco-de (조직) — 개인 계정을 소유자로 만든 토큰은 조직 저장소를 읽지 못한다
      #   - Repository access: coco-de/open-epub 포함
      #   - Permissions: Contents: Read-only
      #   - 조직이 fine-grained PAT 승인을 요구하면 승인까지 끝나야 유효하다
      # 등록: gh secret set PRIVATE_REPO_PAT --repo coco-de/open-board
      - name: Configure git auth for private dependencies
        env:
          PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          if [ -z "$PRIVATE_REPO_PAT" ]; then
            echo "::error::PRIVATE_REPO_PAT 시크릿이 비어 있습니다. coco-de 조직 소유의 fine-grained PAT(${PRIVATE_DEP_REPO}, Contents: Read-only)를 등록하세요: gh secret set PRIVATE_REPO_PAT --repo ${GITHUB_REPOSITORY}"
            exit 1
          fi
          git config --global url."https://x-access-token:${PRIVATE_REPO_PAT}@github.com/coco-de/".insteadOf "https://github.com/coco-de/"

      # pub get 이 403 으로 죽기 전에, 토큰 상태와 저장소 접근을 분리해 판정한다.
      # 토큰 값은 출력하지 않는다 — 종류(prefix)·소유자·만료일·HTTP 코드만 남긴다.
      - name: Verify PRIVATE_REPO_PAT can read the private dependency
        env:
          PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          case "$PRIVATE_REPO_PAT" in
            github_pat_*) kind="fine-grained" ;;
            ghp_*)        kind="classic" ;;
            *)            kind="unknown(길이 ${#PRIVATE_REPO_PAT} — 토큰 값이 아닌 문자열이 등록됐을 수 있음)" ;;
          esac

          hdr="$(mktemp)"; body="$(mktemp)"
          code="$(curl -sS -o "$body" -D "$hdr" -w '%{http_code}' \
            -H "Authorization: Bearer ${PRIVATE_REPO_PAT}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user)"
          if [ "$code" != "200" ]; then
            echo "::error::PRIVATE_REPO_PAT(종류: ${kind}) 가 유효하지 않습니다 — GET /user → HTTP ${code}. 만료됐거나 폐기된 토큰입니다. coco-de 조직 소유의 fine-grained PAT(${PRIVATE_DEP_REPO}, Contents: Read-only)를 재발급해 등록하세요: gh secret set PRIVATE_REPO_PAT --repo ${GITHUB_REPOSITORY}"
            exit 1
          fi
          owner="$(jq -r .login "$body")"
          expires="$(grep -i '^github-authentication-token-expiration:' "$hdr" | cut -d' ' -f2- | tr -d '\r')"
          echo "token: kind=${kind} · owner=${owner} · expires=${expires:-unknown}"

          # pub 이 실제로 쓰는 경로(insteadOf 가 적용된 https clone URL)로 읽기 권한을 확인한다.
          if ! git ls-remote --exit-code "https://github.com/${PRIVATE_DEP_REPO}.git" HEAD >/dev/null 2>"$hdr"; then
            remote_msg="$(grep -E '^(remote:|fatal:)' "$hdr" | tr '\n' ' ' | head -c 300)"
            echo "::error::PRIVATE_REPO_PAT(종류: ${kind}, 소유자: ${owner}) 는 유효하지만 ${PRIVATE_DEP_REPO} 를 읽을 수 없습니다 — ${remote_msg}. Resource owner=coco-de · Repository access 에 open-epub 포함 · Contents: Read-only 로 재발급하고, 조직이 fine-grained PAT 승인을 요구하면 승인까지 완료하세요."
            exit 1
          fi
          echo "✓ ${PRIVATE_DEP_REPO} 읽기 가능 (owner=${owner}, expires=${expires:-unknown})"

      - name: Install dependencies
        working-directory: example
        run: flutter pub get

      - name: Build web (WebAssembly, fallback to JS)
        working-directory: example
        run: |
          flutter build web --wasm --release --base-href /open-board/ || \
          flutter build web --release --base-href /open-board/

      - name: Dry run — skip deploy
        if: ${{ inputs.dry_run }}
        run: |
          echo "dry-run: 빌드 성공, gh-pages 푸시는 건너뜀 (${GITHUB_SHA::7}, ${GITHUB_REF_NAME})"
          echo "✅ dry-run: PAT 검증·의존성 설치·웹 빌드 통과, 배포 생략 (\`${GITHUB_SHA::7}\`)" >> "$GITHUB_STEP_SUMMARY"

      # gh-pages 를 단일 커밋으로 강제 갱신 → 배포 산출물이 히스토리에 누적되지 않는다.
      - name: Deploy to gh-pages branch
        if: ${{ !inputs.dry_run }}
        working-directory: example/build/web
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch .nojekyll
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "deploy: ${GITHUB_SHA::7} 최신 빌드 (${GITHUB_REF_NAME})"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
          echo "🚀 배포: \`${GITHUB_SHA::7}\` → https://coco-de.github.io/open-board/" >> "$GITHUB_STEP_SUMMARY"
