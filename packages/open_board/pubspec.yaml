name: open_board
description: >-
  Flutter drawing & annotation widget — pen/pencil/marker/eraser, lasso
  selection, text and image annotations, multi-page, recording and replay.
version: 0.1.0
repository: https://github.com/coco-de/co-package/tree/main/packages/open_board

environment:
  sdk: ">=3.10.0 <5.0.0"
  flutter: ">=3.41.6"

resolution: workspace

dependencies:
  asset_cache: ^2.2.0
  fixnum: ^1.1.1
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  import_sorter: ^4.6.0
  path_provider: ^2.1.6
  perfect_freehand: ^2.5.1
  protobuf: ^6.0.0
  shared_preferences: ^2.5.3
  value_notifier_tools: ^0.1.2
  vector_math: ^2.2.0

dev_dependencies:
  build_runner: ^2.13.1
  dart_code_metrics_presets: ^2.32.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  json_annotation: ^4.12.0
  json_serializable: ^6.14.0

# The following section is specific to Flutter.
  fake_async: any
  mocktail: any
  shared_preferences: any
  path_provider_platform_interface: any
  plugin_platform_interface: any
flutter:
  assets:
    - res/svgs/

import_sorter:
  emojis: true
