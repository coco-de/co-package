name: co_demo_world
description: >-
  Deterministic demo worlds whose generated display text follows the UI
  language: business data stays fixed, co_faker display data is re-projected
  per language, and user edits survive a language switch.
version: 0.2.0
repository: https://github.com/coco-de/co-package/tree/main/packages/co_demo_world
# pub.dev 에 내지 않는다 — 소비자는 git 의존(path: packages/co_demo_world, ref: 릴리스 커밋)으로 받고,
# 형제 패키지(co_faker · co_demo_prefs)는 같은 커밋의 상대 경로로 따라온다.
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  # 같은 저장소의 형제 패키지 — git 의존으로 받는 쪽도 같은 커밋의 co_faker · co_demo_prefs 를 받는다.
  co_demo_prefs:
    path: ../co_demo_prefs
  co_faker:
    path: ../co_faker
  intl: ">=0.20.0 <0.21.0"

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
