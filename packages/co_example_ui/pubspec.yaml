name: co_example_ui
description: Shared CoUI theme, responsive demo navigation, and locale and appearance controls for Flutter example apps.
version: 0.1.0-beta.1
repository: https://github.com/coco-de/co-package/tree/main/packages/co_example_ui
topics:
  - flutter
  - theme
  - localization
resolution: workspace

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  co_demo_prefs: ^1.0.1
  coui_flutter: ^0.194.2-beta.1
  cupertino_icons: ^1.0.9
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_localizations:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: Pretendard
      fonts:
        - asset: fonts/Pretendard-Regular.otf
          weight: 400
        - asset: fonts/Pretendard-SemiBold.otf
          weight: 600
    - family: NotoSansArabic
      fonts:
        - asset: fonts/NotoSansArabic.ttf
