name: open_epub
description: A customizable EPUB reader widget for Flutter. Supports iOS, Android, and Web platforms with features like pagination, scrolling, bookmarks, and customizable themes.
version: 0.1.3
homepage: https://github.com/Ohgyuchan/open_epub
repository: https://github.com/Ohgyuchan/open_epub

environment:
  sdk: ">=3.6.0 <4.0.0" # pub workspace(resolution: workspace) 최소 요건 (S10.1)
  flutter: ">=3.27.0"

# 모노레포 pub workspace 멤버 (S10.1, ADR-008)
resolution: workspace

platforms:
  android:
  ios:
  web:

dependencies:
  flutter:
    sdk: flutter

  # 모노레포 내부 엔진 (S10.3, ADR-008) — 순수-Dart 파서/모델/코덱/도메인 레이어.
  # resolution: workspace 가 개발 중 로컬 멤버로 해석한다. 버전 제약을 명시해
  # 발행 토폴로지(E6 확정)와 정합; path 의존은 발행 가능 패키지에서 금지된다.
  open_epub_engine: ^0.0.1

  # EPUB viewer and parser
  epub_view: ^3.2.0
  epubx: ^4.0.0

  # Google Fonts
  google_fonts: ^8.1.0
  flutter_html: ^3.0.0
  scrollable_positioned_list: ^0.3.8
  html: ^0.15.6

  # HTTP for URL loading
  http: ^1.6.0

  # Settings persistence
  shared_preferences: ^2.5.5

  # XML parsing — open_epub 1.0 OPF/NCX/nav 파서가 직접 사용 (S1.1)
  xml: ^6.6.1
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
