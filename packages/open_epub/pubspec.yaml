name: open_epub
description: A customizable EPUB reader widget for Flutter. Supports iOS, Android, and Web platforms with features like pagination, scrolling, bookmarks, and customizable themes.
version: 1.1.0
homepage: https://github.com/coco-de/co-package/tree/main/packages/open_epub
repository: https://github.com/coco-de/co-package

environment:
  sdk: ">=3.6.0 <4.0.0" # pub workspace(resolution: workspace) 최소 요건 (S10.1)
  flutter: ">=3.27.0"

# 모노레포 pub workspace 멤버 (S10.1, ADR-008)
resolution: workspace

platforms:
  android:
  ios:
  web:

dependencies:
  flutter:
    sdk: flutter

  # 순수-Dart 엔진 (S10.3, ADR-008) — 파서/모델/코덱/도메인 레이어.
  # ADR-002-a: 엔진은 pub.dev에 별도 발행되며 lockstep(동반 1.0.0)으로 좁은 범위를
  # 핀한다. resolution: workspace 가 개발 중엔 로컬 멤버로 해석하고, 발행 시엔
  # pub.dev의 엔진을 해석한다. path 의존은 발행 가능 패키지에서 금지된다.
  open_epub_engine: ">=1.0.0 <1.1.0"

  # Reflowable 본문 렌더러 (S11.3 #90, ADR-009). flutter_html에서 교체 —
  # 활발히 유지보수되고 SVG(fwfh_svg)를 즉시 지원한다.
  #
  # all-in-one `flutter_widget_from_html` 대신 core + fwfh_svg만 채택한다:
  # all-in-one은 fwfh_webview(=`<iframe>`→WebView)·video·audio를 끌어와 이
  # 리더의 보안 모델(script/iframe 의도적 차단, F1-Adv1)과 충돌하기 때문. core는
  # SVG만 mixin으로 더한다.
  flutter_widget_from_html_core: ^0.17.0
  fwfh_svg: ^0.16.0

  # S14.2(#106, gap #5): MathML 자체 폴백 렌더. fwfh는 <math>를 지원하지 않으므로
  # customWidgetBuilder에서 MathML→TeX 변환 후 flutter_math_fork로 렌더한다.
  # 변환 불가/파싱 실패 시 placeholder로 폴백(never-empty, ADR-009).
  flutter_math_fork: ^0.7.3

  # S14.2(#106): MathML presentation 트리(dom.Element) 순회로 TeX 변환. fwfh가
  # 전이 의존하지만, MathML 자식 순회를 위해 직접 참조하므로 명시 의존으로 둔다.
  # (S11.2에서 레거시 파서용으로 drop됐던 것을 렌더 목적으로 재도입)
  html: ^0.15.4

  # #278: 문서 <style> 선택자 매칭. fwfh가 전이 의존하지만 customStylesBuilder
  # 전처리에서 직접 파싱하므로 명시 의존으로 승격한다.
  csslib: ^1.0.2

  # #278: SVG-래핑 FXL의 archive <image href>를 data URI로 치환한 뒤
  # SvgPicture.string으로 렌더. fwfh_svg가 전이 의존하지만 직접 참조하므로
  # 명시 의존으로 승격한다(기존에는 테스트 전용 dev_dependency).
  flutter_svg: ^2.0.0

  # S15.2(#109, gap #6 재생분): Media Overlays 오디오 재생 기본 구현. MediaAudioPlayer
  # 추상 인터페이스 뒤에 두어 호스트가 자체 오디오 스택으로 교체 가능하며, 테스트는
  # fake player로 결정적으로 검증한다(플러그인 경계는 미단언).
  just_audio: ^0.10.0

  # 전체 spine 연속 세로 스크롤의 위치 추적 (kobic#7572, reflowable_engine)
  scrollable_positioned_list: ^0.3.8

  # S11.2(#89): 레거시 EpubReaderWidget 제거로 미사용이 된 의존성 drop —
  # epubx/epub_view/html(레거시 파서·렌더), google_fonts/shared_preferences/http
  # (레거시 위젯·설정·로더), xml/archive(파서는 S10.3에서 엔진으로 이동). EPUB
  # 컨테이너 해제·OPF/NCX 파싱은 이제 open_epub_engine이 전담한다.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
