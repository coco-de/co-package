name: open_epub_example
description: Example app for open_epub package.

publish_to: "none"

version: 1.0.0+1

# 모노레포 pub workspace 멤버 (S10.3) — open_epub → open_epub_engine 를 로컬 해석
resolution: workspace

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  open_epub:
    path: ../

  # 데모 포털(demo.cocode.im)에서 고른 언어 · 테마 이어받기 — 같은 워크스페이스 멤버 (#44)
  co_demo_prefs:
    path: ../../co_demo_prefs

  # 11개 언어 번역 — lib/i18n/*.i18n.json → `dart run slang` (생성물 커밋)
  intl: any
  slang: ^4.19.2
  slang_flutter: ^4.19.0

  cupertino_icons: ^1.0.9

  # 하이라이트 데모 영속 (#43)
  shared_preferences: ^2.5.5
  marionette_flutter: ^0.6.0

  # 데모 EPUB 합성 생성 (#235) — lib/demo_epub.dart
  archive: ^4.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
