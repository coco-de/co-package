# 재사용 워크플로우 — 단일 Flutter 앱 CI (+ 선택 빌드)
#
# 서비스 레포에서 (호출 대상은 `@main` 같은 이동 ref 대신 태그 또는 커밋 SHA 로 고정):
#   jobs:
#     app:
#       uses: coco-de/co-package/.github/workflows/flutter-ci.yml@<커밋 SHA>
#       with:
#         build-targets: 'apk,ios'
#
# iOS/macOS 빌드에 필요한 Xcode를 제공하는 macos-latest가 기본값입니다.
# GitHub-hosted 러너에서는 Flutter stable SDK를 설치합니다.

name: Flutter CI

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'runs-on 값 (JSON)'
        type: string
        default: '"macos-latest"'
      working-directory:
        description: 'Flutter 앱 경로'
        type: string
        default: '.'
      build-targets:
        description: '빌드 타깃 CSV: apk, appbundle, ios, macos, web / 빈 값이면 빌드 생략'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: runner.environment == 'github-hosted'
        with:
          channel: stable
          cache: true

      - name: 툴체인 버전
        run: flutter --version

      - name: pub get
        run: flutter pub get

      - name: analyze
        run: dart analyze --fatal-infos

      - name: test
        run: |
          if [ -d test ]; then flutter test; else echo "test 디렉토리 없음 — 건너뜀"; fi

      - name: build
        if: inputs.build-targets != ''
        run: |
          IFS=',' read -ra TARGETS <<< "${{ inputs.build-targets }}"
          for t in "${TARGETS[@]}"; do
            t="$(echo "$t" | xargs)"
            echo "::group::flutter build $t"
            case "$t" in
              ios)   flutter build ios --no-codesign ;;
              *)     flutter build "$t" ;;
            esac
            echo "::endgroup::"
          done
