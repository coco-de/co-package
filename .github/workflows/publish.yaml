# pub.dev 자동 발행 — 태그 트리거 (S6.7 #243, ADR-002-a 옵션 A: lockstep 별도 발행)
#
# 토폴로지: open_epub_engine(순수 Dart)을 pub.dev에 별도 발행하고, open_epub(리더)은
# `open_epub_engine: ">=1.0.0 <1.1.0"`로 의존한다. 발행 순서는 **엔진 → 리더**.
#
# ── 발행 순서가 강제되는 방식 ────────────────────────────────────────────────
# 리더는 pub.dev의 엔진에 의존하므로, 엔진 1.x가 아직 pub.dev에 없으면 리더의
# `dart pub publish` 검증이 의존성 해석에 실패한다. 즉 "엔진 먼저"는 관례가 아니라
# pub.dev가 강제하는 불변식이다.
#
# ⚠️ 이 순서는 과거 "사람이 엔진 태그를 먼저 밀고 pub.dev 반영을 확인한 뒤 리더
#    태그를 민다"는 수동 절차로 지켜졌다. release-please 도입(kobic Epic #8662) 후에는
#    Release PR 머지 한 번에 엔진·리더 태그가 **같은 커밋에 함께 push** 되고, GitHub은
#    태그마다 별도 워크플로 run을 띄우므로 두 발행이 병렬로 돈다. 그래서 아래
#    `wait-for-engine` 게이트 잡이 순서를 복원한다 — 상세는 해당 잡의 주석 참조.
#
# ── 릴리스 절차 (release-please 자동) ───────────────────────────────────────
#   1) main에 feat/fix 머지 → Release PR이 자동 생성·갱신됨
#   2) Release PR 머지 → 버전 확정 + 엔진/리더 태그 + GitHub Release 발행
#   3) 태그 push가 이 워크플로를 트리거 → 엔진 발행 → (게이트) → 리더 발행
#
#   수동 발행이 필요하면 태그를 직접 밀어도 동작한다(게이트가 알아서 통과/대기).
#
# ── pub.dev 사전 설정 (레포 관리자 1회, 최초 발행 전 필수) ───────────────────
#   - 각 패키지의 pub.dev "Admin > Automated publishing"에서 GitHub Actions 발행을 활성화:
#       * Repository: <owner>/<repo>
#       * Tag pattern: open_epub_engine-v{{version}}  (엔진) / open_epub-v{{version}}  (리더)
#   - 최초 1회는 소유자가 `dart pub publish`로 수동 발행해 패키지를 생성/클레임해야 할 수 있다
#     (자동 발행은 기존 패키지에 대해 동작). OIDC라 장기 토큰/시크릿은 불필요.
#
# 이 워크플로는 dart-lang/setup-dart의 공식 재사용 워크플로를 호출한다(OIDC 토큰 교환 처리).

name: publish

on:
  push:
    tags:
      # 엔진: open_epub_engine-v1.2.3 / -v1.2.3-beta.1 등
      - "open_epub_engine-v[0-9]+.[0-9]+.[0-9]+*"
      # 리더: open_epub-v1.2.3 등 ("open_epub-v"는 "open_epub_engine-v"와 겹치지 않음)
      - "open_epub-v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  publish-engine:
    # open_epub_engine-v* 태그에서만 실행.
    if: ${{ startsWith(github.ref, 'refs/tags/open_epub_engine-v') }}
    permissions:
      id-token: write # pub.dev OIDC 토큰 교환에 필요
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/open_epub_engine

  # ── 발행 순서 강제 게이트 ────────────────────────────────────────────────────
  # 리더는 pub.dev 의 엔진에 의존한다(open_epub_engine: ">=1.0.0 <1.1.0"). 엔진이
  # pub.dev 에 반영되기 전에 리더를 발행하면 의존성 해석 단계에서 실패한다.
  #
  # 과거에는 사람이 "엔진 태그 push → pub.dev 확인 → 리더 태그 push" 순서를 지키는
  # 것을 전제로 했으나, release-please 도입 후에는 Release PR 머지 한 번에 엔진·리더
  # 태그가 같은 커밋에 함께 push 된다. GitHub 은 태그마다 별도 워크플로 run 을 띄우므로
  # 두 발행 잡이 병렬로 돌아 그 전제가 깨진다.
  #
  # 이 잡은 "현재 커밋에 엔진 태그가 함께 달려 있으면 그 버전이 pub.dev 에 나타날
  # 때까지" 리더 발행을 붙잡아 순서를 복원한다. 엔진이 이번에 함께 발행되지 않는
  # 경우(리더만 릴리즈)에는 즉시 통과한다.
  wait-for-engine:
    name: Wait for engine on pub.dev
    if: ${{ startsWith(github.ref, 'refs/tags/open_epub-v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git tag --points-at 을 쓰려면 태그가 필요

      - name: Gate on engine availability
        run: |
          ENGINE_TAG=$(git tag --points-at HEAD | grep '^open_epub_engine-v' | head -1 || true)
          if [ -z "$ENGINE_TAG" ]; then
            echo "같은 커밋에 엔진 태그 없음 — 엔진 동시 발행 아님. 대기 불필요."
            exit 0
          fi

          VERSION="${ENGINE_TAG#open_epub_engine-v}"
          echo "엔진 $VERSION 이 pub.dev 에 반영될 때까지 대기 (최대 20분)"

          for i in $(seq 1 60); do
            if curl -sf "https://pub.dev/api/packages/open_epub_engine" \
                 | jq -e --arg v "$VERSION" '.versions[] | select(.version == $v)' >/dev/null 2>&1; then
              echo "✅ open_epub_engine $VERSION 확인 — 리더 발행 진행"
              exit 0
            fi
            echo "  ... 대기 중 ($i/60)"
            sleep 20
          done

          echo "::error::open_epub_engine $VERSION 이 20분 내에 pub.dev 에 나타나지 않았다."
          echo "엔진 발행 잡(publish-engine)이 실패했는지 확인할 것."
          exit 1

  publish-reader:
    # open_epub-v* 태그에서만 실행(엔진 태그에는 매칭되지 않음).
    needs: wait-for-engine
    if: ${{ startsWith(github.ref, 'refs/tags/open_epub-v') }}
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/open_epub
