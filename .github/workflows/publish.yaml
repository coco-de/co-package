name: Publish to pub.dev

on:
  push:
    tags:
      - 'co_arc-v[0-9]+.[0-9]+.[0-9]+*'
      - 'co_bdd-v[0-9]+.[0-9]+.[0-9]+*'
      - 'co_demo_prefs-v[0-9]+.[0-9]+.[0-9]+*'
      - 'co_demo_world-v[0-9]+.[0-9]+.[0-9]+*'
      - 'co_example_ui-v[0-9]+.[0-9]+.[0-9]+*'
      - 'co_faker-v[0-9]+.[0-9]+.[0-9]+*'
      - 'co_golden-v[0-9]+.[0-9]+.[0-9]+*'
      - 'co_golden_gallery-v[0-9]+.[0-9]+.[0-9]+*'
      - 'co_site_metadata-v[0-9]+.[0-9]+.[0-9]+*'
      - 'co_storage-v[0-9]+.[0-9]+.[0-9]+*'
      - 'co_xterm2-v[0-9]+.[0-9]+.[0-9]+*'
      - 'co_xterm3-v[0-9]+.[0-9]+.[0-9]+*'
      - 'open_board-v[0-9]+.[0-9]+.[0-9]+*'
      - 'open_epub-v[0-9]+.[0-9]+.[0-9]+*'
      - 'open_epub_engine-v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pub.dev
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # Include sibling release tags for the dependency wait.
          persist-credentials: false
      # setup-dart configures pub.dev's OIDC token. Flutter supplies the Dart binary
      # for both Flutter and pure Dart packages.
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - run: python3 tool/pub_release.py --tag "$GITHUB_REF_NAME"
