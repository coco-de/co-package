name: Examples Pages

# All three CoUI examples use hosted dependencies and share one Pages artifact.
# A verified prebuilt site can also be deployed from gh-pages.
on:
  push:
    branches: [main]
    paths:
      - "packages/open_board/**"
      - "packages/open_epub/**"
      - "packages/open_epub_engine/**"
      - "packages/co_example_ui/**"
      - "packages/co_demo_prefs/**"
      - "packages/xterm2/**"
      - "pubspec.yaml"
      - "THIRD_PARTY_LICENSES"
      - "tool/pages/**"
      - ".github/workflows/examples-pages.yml"
  workflow_dispatch:
    inputs:
      prebuilt_ref:
        description: "Optional ref containing the verified static site (e.g. gh-pages)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: pages

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.prebuilt_ref != ''
        with:
          ref: ${{ inputs.prebuilt_ref }}
          path: _site
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: inputs.prebuilt_ref == ''
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Build all examples
        if: inputs.prebuilt_ref == ''
        run: |
          bash tool/pages/build.sh
          mv build/pages _site

      - name: Validate and scan site
        run: |
          test -f _site/index.html
          test -f _site/open-board/index.html
          test -f _site/open-epub/index.html
          test -f _site/xterm2/index.html
          cmp _site/THIRD_PARTY_LICENSES.txt <(cat THIRD_PARTY_LICENSES packages/xterm2/example/THIRD_PARTY_LICENSES)
          cmp _site/FONT-LICENSES.txt <(cat packages/co_example_ui/fonts/{LICENSE.txt,NotoSansArabic-LICENSE.txt} \
            packages/xterm2/example/fonts/CascadiaMonoPL-LICENSE.txt)
          python3 tool/pages/check_no_credentials.py _site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
