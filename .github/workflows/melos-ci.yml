# 재사용 워크플로우 — melos 모노레포 공용 CI
#
# 서비스 레포에서 (호출 대상은 `@main` 같은 이동 ref 대신 태그 또는 커밋 SHA 로 고정):
#   jobs:
#     ci:
#       uses: coco-de/co-package/.github/workflows/melos-ci.yml@<커밋 SHA>
#       with:
#         runs-on: '["self-hosted", "macos", "flutter"]'
#
# 전제: self-hosted 러너에 Flutter SDK가 설치되어 있어야 합니다.
#       melos는 잡 안에서 pub global로 활성화합니다.

name: Melos CI

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'runs-on 값 (JSON 배열 또는 단일 라벨의 JSON 문자열)'
        type: string
        default: '["self-hosted", "macos", "flutter"]'
      working-directory:
        description: '모노레포 루트 경로'
        type: string
        default: '.'
      analyze-script:
        description: 'melos run <analyze 스크립트 이름> (빈 값이면 melos exec dart analyze)'
        type: string
        default: ''
      test-script:
        description: 'melos run <test 스크립트 이름> (빈 값이면 melos exec flutter test)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  melos:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 툴체인 버전
        run: |
          dart --version
          flutter --version || true

      - name: melos 활성화
        run: |
          dart pub global activate melos
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: bootstrap
        run: melos bootstrap

      - name: analyze
        run: |
          if [ -n "${{ inputs.analyze-script }}" ]; then
            melos run ${{ inputs.analyze-script }}
          else
            melos exec -c 1 -- "dart analyze --fatal-infos"
          fi

      - name: test
        run: |
          if [ -n "${{ inputs.test-script }}" ]; then
            melos run ${{ inputs.test-script }}
          else
            melos exec -c 1 --dir-exists=test -- "flutter test || dart test"
          fi
