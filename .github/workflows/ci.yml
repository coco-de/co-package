name: CI

# open_epub·open_board 가 Flutter 패키지라 pub workspace 해석(pub get)에 Flutter SDK 가 필요하다.
# 순수 Dart 패키지(co_arc, co_faker)도 같은 워크스페이스로 함께 해석된다.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 이식(epub_pro CFI) 코드의 attribution 누락 차단 — SDK 불필요.
  license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash tool/check_licenses.sh

  # 외부 uses: 는 40자리 커밋 SHA 로 고정한다 — 고정되지 않은 참조가 들어오면 실패. SDK 불필요.
  action-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tool/check_action_pins.py

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - name: Verify the public workspace
        run: python3 tool/pages/public_workspace.py format analyze test:dart test:flutter
      # 파생 seed 가 VM 과 웹에서 같은지 — 웹으로 배포한 데모와 VM 에서 찍은 골든이 같은 목데이터를 보여야 한다 (#69).
      - name: co_faker web determinism (chrome · dart2js)
        working-directory: packages/co_faker
        run: dart test -p chrome test/random_source_platform_test.dart
      # 데모 세계의 업무 · 표시 데이터가 웹과 VM 에서 같은지 (co_demo_world 전체를 chrome 에서도).
      - name: co_demo_world web determinism (chrome · dart2js)
        working-directory: packages/co_demo_world
        run: dart test -p chrome
      - name: Check package release archives
        run: python3 tool/pub_release.py --check-all

  # co_arc 러너 스크립트/워크플로우 문법 검증
  lint-runner-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck packages/co_arc/scripts/*.sh packages/co_arc/arc/*.sh

      # 버전을 고정하고 릴리스 아카이브(linux_amd64 — ubuntu-latest 는 x86_64)의 SHA-256 을
      # 확인한 뒤에만 푼다. 올릴 때는 두 값을 함께 바꾼다 — 해시는 그 릴리스의
      # actionlint_<버전>_checksums.txt 에 있다.
      - name: actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" -color
