name: CI

# open_epub·open_board 가 Flutter 패키지라 pub workspace 해석(pub get)에 Flutter SDK 가 필요하다.
# 순수 Dart 패키지(co_arc, co_faker)도 같은 워크스페이스로 함께 해석된다.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.0"

jobs:
  # 이식(epub_pro CFI) 코드의 attribution 누락 차단 — SDK 불필요.
  license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tool/check_licenses.sh

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # co_golden_gallery renders with private coco-de/coui. This public repo
      # has no Actions secret that can read it, so run the remaining workspace
      # checks without resolving that member, then check its source formatting.
      - name: Exclude private CoUI gallery from public CI workspace
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pubspec = Path('pubspec.yaml')
          marker = '  - packages/co_golden_gallery\n'
          text = pubspec.read_text()
          if text.count(marker) != 1:
              raise SystemExit('co_golden_gallery workspace entry not found exactly once')
          pubspec.write_text(text.replace(marker, ''))
          PY
      # --no-example: packages/open_board/example 은 private coco-de/open-epub 을 git
      # 의존성으로 쓰므로 CI 의 워크스페이스 해석에서 제외한다(인증 불가 → exit 69).
      - run: flutter pub get --no-example
      - run: dart format --output=none --set-exit-if-changed packages/co_golden_gallery
      - run: dart pub global activate melos
      - run: melos run format
      - run: melos run analyze
      - run: melos run test:dart
      - run: melos run test:flutter

  # packages/xterm3 — klc/xterm3 포크(AGPL-3.0). 워크스페이스 비회원이라 melos 잡이
  # 보지 않는다: 업스트림 dev 의존(lints ^3)이 루트 lints ^6 과 한 lockfile 에서
  # 풀리지 않고, 업스트림과 바이트 동일을 유지해야 동기화된다(packages/xterm3/FORK.md).
  # 업스트림 CI 와 같은 검사를 macOS 에서 돌린다 — 골든 4장이 macOS 에서 렌더됐다.
  xterm3:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: packages/xterm3
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: flutter test

  # co_arc 러너 스크립트/워크플로우 문법 검증
  lint-runner-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck packages/co_arc/scripts/*.sh packages/co_arc/arc/*.sh

      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
