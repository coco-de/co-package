name: CI

# open_epub·open_board 가 Flutter 패키지라 pub workspace 해석(pub get)에 Flutter SDK 가 필요하다.
# 순수 Dart 패키지(co_arc, co_faker)도 같은 워크스페이스로 함께 해석된다.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.0"

jobs:
  # 이식(epub_pro CFI) 코드의 attribution 누락 차단 — SDK 불필요.
  license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: bash tool/check_licenses.sh

  # 외부 uses: 는 40자리 커밋 SHA 로 고정한다 — 고정되지 않은 참조가 들어오면 실패. SDK 불필요.
  action-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: python3 tool/check_action_pins.py

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Public package checks stay independent of the private CoUI examples.
      # Full example analysis, tests and builds run locally or with COUI_READ_TOKEN.
      - name: Prepare public CI workspace
        run: python3 tool/pages/public_workspace.py
      - run: flutter pub get --no-example
      - run: dart format --output=none --set-exit-if-changed packages/co_golden_gallery
      - run: dart pub global activate melos
      - run: melos run format
      - run: melos run analyze
      - run: melos run test:dart
      # 파생 seed 가 VM 과 웹에서 같은지 — 웹으로 배포한 데모와 VM 에서 찍은 골든이 같은 목데이터를 보여야 한다 (#69).
      - name: co_faker web determinism (chrome · dart2js)
        working-directory: packages/co_faker
        run: dart test -p chrome test/random_source_platform_test.dart
      # 데모 세계의 업무 · 표시 데이터가 웹과 VM 에서 같은지 (co_demo_world 전체를 chrome 에서도).
      - name: co_demo_world web determinism (chrome · dart2js)
        working-directory: packages/co_demo_world
        run: dart test -p chrome
      - run: melos run test:flutter

  # packages/xterm3 — klc/xterm3 포크(AGPL-3.0). 워크스페이스 비회원이라 melos 잡이
  # 보지 않는다: 업스트림 dev 의존(lints ^3)이 루트 lints ^6 과 한 lockfile 에서
  # 풀리지 않고, 업스트림과 바이트 동일을 유지해야 동기화된다(packages/xterm3/FORK.md).
  # 업스트림 CI 와 같은 검사를 macOS 에서 돌린다 — 골든 4장이 macOS 에서 렌더됐다.
  xterm3:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: packages/xterm3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: flutter test

  # MIT xterm2 포크 — 비회원 패키지의 공개 API·IME 대역·회귀를 독립 검증한다.
  # 원천 Mac 전용 골든은 테스트의 기존 플랫폼 조건을 유지한다.
  xterm2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/xterm2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --no-example
      - name: 변경된 입력 경로와 IME 시험 포맷
        run: |
          dart format --output=none --set-exit-if-changed lib/src/terminal_view.dart lib/src/ui/custom_text_edit.dart test/src/ui/ime
      - run: flutter analyze --no-pub lib test/src/ui/ime
      - run: flutter test --no-pub --exclude-tags platform-golden

  # co_arc 러너 스크립트/워크플로우 문법 검증
  lint-runner-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck packages/co_arc/scripts/*.sh packages/co_arc/arc/*.sh

      # 버전을 고정하고 릴리스 아카이브(linux_amd64 — ubuntu-latest 는 x86_64)의 SHA-256 을
      # 확인한 뒤에만 푼다. 올릴 때는 두 값을 함께 바꾼다 — 해시는 그 릴리스의
      # actionlint_<버전>_checksums.txt 에 있다.
      - name: actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" -color
