# 재사용 워크플로우 — Serverpod 서버 테스트
#
# Postgres·Redis 서비스 컨테이너를 띄우므로 Docker 가능한 Linux 러너가 필요합니다.
# (ARC dind 러너: runs-on: arc-dart / GitHub-hosted: ubuntu-latest)
# macOS self-hosted 러너에서는 services:가 동작하지 않습니다.
#
# 서비스 레포에서:
#   jobs:
#     server:
#       uses: coco-de/co-arc/.github/workflows/serverpod-ci.yml@main
#       with:
#         runs-on: '"arc-dart"'
#         server-directory: 'packages/my_server'
#
# 전제: 서버의 config/test.yaml이 아래 서비스 접속 정보와 일치해야 합니다.
#   database: host localhost, port 5432, name serverpod_test, user postgres
#   redis:    host localhost, port 6379

name: Serverpod CI

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'runs-on 값 (JSON)'
        type: string
        default: '"arc-dart"'
      server-directory:
        description: 'Serverpod 서버 패키지 경로'
        type: string
        default: '.'
      dart-version:
        description: 'Dart SDK 버전 (컨테이너 이미지 태그)'
        type: string
        default: 'stable'
    secrets:
      DB_PASSWORD:
        description: 'config/test.yaml과 일치하는 테스트 DB 비밀번호'
        required: false

jobs:
  serverpod:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    container:
      image: dart:${{ inputs.dart-version }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD || 'password' }}
          POSTGRES_DB: serverpod_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: ${{ inputs.server-directory }}
    steps:
      - uses: actions/checkout@v4

      - name: pub get
        run: dart pub get

      - name: analyze
        run: dart analyze --fatal-infos

      - name: test
        env:
          # 컨테이너 잡에서는 서비스에 서비스 이름(호스트)으로 접근합니다.
          # config/test.yaml에서 host를 env로 읽도록 구성했다면 그대로 사용됩니다.
          POSTGRES_HOST: postgres
          REDIS_HOST: redis
        run: dart test
