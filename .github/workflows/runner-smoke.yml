# GitHub 표준 러너와 Dart/Flutter 실행 환경을 확인하는 수동 워크플로우

name: Runner Smoke Test

on:
  workflow_dispatch:
    inputs:
      target:
        description: '확인할 러너'
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - macos-latest

permissions:
  contents: read

jobs:
  smoke-macos:
    if: inputs.target == 'macos-latest'
    runs-on: macos-latest
    steps:
      - name: 러너 정보
        run: |
          echo "runner  : $RUNNER_NAME"
          echo "os/arch : $(uname -s) $(uname -m)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - name: Flutter 및 iOS 툴체인 확인
        run: |
          flutter --version
          dart --version
          pod --version
          xcodebuild -version

  smoke-ubuntu:
    if: inputs.target == 'ubuntu-latest'
    runs-on: ubuntu-latest
    container:
      image: dart:stable
    steps:
      - name: 러너 정보
        run: |
          echo "runner  : $RUNNER_NAME"
          echo "os/arch : $(uname -s) $(uname -m)"
      - name: Dart 확인
        run: dart --version
